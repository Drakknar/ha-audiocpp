name: Checks

# Runs on every pull request (Dependabot's included) and on pushes to main:
# the pytest suite in custom_components/audiocpp/tests (against its fake
# audio.cpp server) on Home Assistant's test harness, and actionlint on the
# workflows themselves.
# Not a required check yet: pull requests opened by the Compatibility review
# use GITHUB_TOKEN, which doesn't trigger this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # 0.13.373 = Home Assistant 2026.10.2.
  HARNESS: pytest-homeassistant-custom-component==0.13.373

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install the test harness
        # mutagen and ha-ffmpeg: needed by the tts and stt platforms.
        run: |
          uv venv -p 3.14 "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          VIRTUAL_ENV=$RUNNER_TEMP/venv uv pip install "$HARNESS" mutagen ha-ffmpeg

      - name: pytest
        working-directory: custom_components/audiocpp
        run: python -m pytest

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Home Assistant core's rules (.ruff.toml) and formatting.
      - name: ruff check
        run: uvx ruff@0.17.3 check --output-format github .
      - name: ruff format
        run: uvx ruff@0.17.3 format --check .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The checks Home Assistant's integration_blueprint runs on custom integrations.
      - name: hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master
      - name: HACS
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

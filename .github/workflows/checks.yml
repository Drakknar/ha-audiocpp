name: Checks

# Runs on every pull request (Dependabot's included) and on pushes to main:
# the pytest suite in custom_components/audiocpp/tests (against its fake
# audio.cpp server) on Home Assistant's test harness, and actionlint on the
# workflows themselves.
# Its jobs are required on main. Pull requests opened by the Compatibility review
# use GITHUB_TOKEN, which doesn't trigger this workflow: close and reopen one by
# hand to run them. Release waits for this workflow on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum (hacs.json): the old harness, 0.13.373 = Home Assistant 2026.10.2.
  HARNESS_MIN: pytest-homeassistant-custom-component==0.13.373
  # Current: core's harness, same version as homeassistant. Install it from the core tag until
  # PyPI has pytest-homeassistant 2026.11.0 (the PyPI 0.1.x is an unrelated project).
  HA_CURRENT: homeassistant==2026.11.0
  HARNESS_CURRENT: pytest-homeassistant@git+https://github.com/home-assistant/core@2026.11.0#subdirectory=packages/pytest-homeassistant

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # One venv per harness: the two must not be installed together.
      # mutagen and ha-ffmpeg: needed by the tts and stt platforms.
      - name: Install the test harnesses
        run: |
          uv venv -p 3.14 "$RUNNER_TEMP/min"
          VIRTUAL_ENV=$RUNNER_TEMP/min uv pip install "$HARNESS_MIN" mutagen ha-ffmpeg
          uv venv -p 3.14 "$RUNNER_TEMP/current"
          VIRTUAL_ENV=$RUNNER_TEMP/current uv pip install "$HA_CURRENT" "$HARNESS_CURRENT" mutagen ha-ffmpeg

      - name: pytest (minimum Home Assistant)
        working-directory: custom_components/audiocpp
        run: '"$RUNNER_TEMP/min/bin/python" -m pytest'

      - name: pytest (current Home Assistant)
        working-directory: custom_components/audiocpp
        run: '"$RUNNER_TEMP/current/bin/python" -m pytest'

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Home Assistant core's rules (.ruff.toml) and formatting.
      - name: ruff check
        run: uvx ruff@0.17.3 check --output-format github .
      - name: ruff format
        run: uvx ruff@0.17.3 format --check .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checks Home Assistant's integration_blueprint runs on custom integrations.
      - name: hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
      - name: HACS
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

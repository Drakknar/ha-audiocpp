[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The repository root, so tests import the integration as Home Assistant
# loads it: custom_components.audiocpp.
pythonpath = ../..
# no:respx lets Home Assistant (2026.11+) alias httpx before respx imports it.
addopts = --import-mode=importlib -p no:respx
